{% extends "layout.html" %}
{% block main %}
<div class="container mt-4" style="max-width:600px;">
    <a href="/dashboard" class="btn btn-outline-light btn-sm mb-3">&larr;Back to Dashboard</a>
    <div class="card bg-dark text-light border-secondary p-4 shadow">
        <h3 class="mb-3 text-warning">Edit Paper Details</h3>
        <form action="/edit_paper/{{paper.id}}" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label text-muted">Title</label>
                <input type="text" name="title" class="form-control bg-secondary text-light border-0" value="{{paper.title}}" required>


            </div>
            <div class="mb-3 text-start">
                <label class="form-label text-muted">Authors</label>
                <input type="text" name="authors" class="form-control bg-secondary text-light border-0" value="{{paper.authors or ''}}" required>


            </div>
            <div class="mb-3 text-start">
                <label class="form-label text-muted">Year</label>
                <input type="text" name="title" class="form-control bg-secondary text-light border-0" value="{{paper.year or ''}}" required>


            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-warning fw-bold flex-grow-1">Save Changes</button>
                <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
            </div>



        </form>
     </div>


</div>
{% endblock %}
