<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <title> My ScholarLibrary</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/">🎓 My ScholarLibrary</a>
                <div class="ms-auto">
                    {% if session.user_id %}
                        <a class="btn btn-outline-light me-2" href="/dashboard">Dashboard</a>
                        <a class="btn btn-outline-light" href="/logout">Logout</a>
                     {% else %}
                        <a class="btn btn-outline-light me-2" href="/login">Sign In</a>
                        <a class="btn btn-light" href="/register">Sign Up</a>
                     {% endif %}

                </div>
            </div>
        </nav>
        <div class="container mt-4">
            {% with messages= get_flashed_messages() %}
                {% if messages %}
                   {% for message in messages %}
                       <div class=" alert alert_info">{{ message }}</div>
                   {% endfor %}
                {% endif %}
            {% endwith %}
            {% block main %}{% endblock %}
        </div>
    </body>
</html>
